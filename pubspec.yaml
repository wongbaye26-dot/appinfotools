name: apk_info_tool
description: AppInfoTool — 应用包详情查看工具。
homepage: https://feng.to
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Git release 时会自动从tag同步
version: 2.8.5

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.1
  package_info_plus: ^9.0.0
  slang: ^4.3.0
  slang_flutter: ^4.3.0
  # 精确锁定 0.20.2 会与 Flutter stable 的 flutter_localizations（要求 ^0.20.3）
  # 冲突，导致 `flutter pub get` 无法解析。放宽到 ^0.20.3 以对齐当前 stable。
  intl: ^0.20.3
  file_picker: ^10.3.8
  window_manager: ^0.5.1
  # window_manager 不重新导出 screen_retriever，而初始窗口尺寸需要按
  # 屏幕可用区域夹紧（1366×768 这类小屏放不下 1280×800），故显式声明。
  screen_retriever: ^0.2.2
  shared_preferences: ^2.3.3
  flutter_colorpicker: ^1.0.3
  desktop_drop: ^0.7.0
  archive:
    git:
      url: https://github.com/huanfeng/archive.git
      ref: cb3a07c80d6a475ef8d36e5642bc2691612d074e
  logging: ^1.3.0
  crypto: ^3.0.6
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  xml: ^6.5.0
  path_drawing: ^1.0.1
  apk_parser:
    path: packages/apk_parser
  archive_safety:
    path: packages/archive_safety
  analysis_model:
    path: packages/analysis_model
  ipa_parser:
    path: packages/ipa_parser
  # 无界面图标提取器：Windows 缩略图处理器调它的 AOT 产物。
  # 主应用**不直接依赖**它的提取逻辑（界面用 AdaptiveIconRenderer，
  # 能合成自适应图标），但一致性测试要拿两者对照（规格 5.2）。
  app_icon_extractor:
    path: packages/app_icon_extractor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  slang_build_runner: ^4.3.0
  riverpod_lint: ^3.0.3
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.13
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  # 这里声明的都会被**打包进产物**，因此只放运行时真正需要的资产。
  # README 用的图片放在 docs/assets/ 下，不进包。
  assets:
    - assets/image/icon.png

# 安装包不再由 `inno_bundle` 生成，脚本在 `windows/installer/appinfotool.iss`
# 自己维护（CI 直接调 ISCC）。原因见那份文件头：它的生成器把「安装目录页 /
# 语言选择 / 文件关联」都写死了，配置改不出来。
