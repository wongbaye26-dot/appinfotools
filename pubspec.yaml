name: apk_info_tool
description: AppInfoTool — 应用包详情查看工具。
homepage: https://feng.to
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Git release 时会自动从tag同步
version: 2.3.0

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.1
  package_info_plus: ^9.0.0
  slang: ^4.3.0
  slang_flutter: ^4.3.0
  # 精确锁定 0.20.2 会与 Flutter stable 的 flutter_localizations（要求 ^0.20.3）
  # 冲突，导致 `flutter pub get` 无法解析。放宽到 ^0.20.3 以对齐当前 stable。
  intl: ^0.20.3
  file_picker: ^10.3.8
  window_manager: ^0.5.1
  # window_manager 不重新导出 screen_retriever，而初始窗口尺寸需要按
  # 屏幕可用区域夹紧（1366×768 这类小屏放不下 1280×800），故显式声明。
  screen_retriever: ^0.2.2
  shared_preferences: ^2.3.3
  flutter_colorpicker: ^1.0.3
  desktop_drop: ^0.7.0
  archive:
    git:
      url: https://github.com/huanfeng/archive.git
      ref: cb3a07c80d6a475ef8d36e5642bc2691612d074e
  logging: ^1.3.0
  crypto: ^3.0.6
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  xml: ^6.5.0
  path_drawing: ^1.0.1
  apk_parser:
    path: packages/apk_parser
  archive_safety:
    path: packages/archive_safety
  analysis_model:
    path: packages/analysis_model
  ipa_parser:
    path: packages/ipa_parser

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  inno_bundle: ^0.11.2
  slang_build_runner: ^4.3.0
  riverpod_lint: ^3.0.3
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.13
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  # 这里声明的都会被**打包进产物**，因此只放运行时真正需要的资产。
  # README 用的图片放在 docs/assets/ 下，不进包。
  assets:
    - assets/image/icon.png

inno_bundle:
  id: 8cdac933-dde4-5d06-985d-4c99f7247903
  publisher: Feng
  # 同时决定：安装包文件名（<name>-<arch>-<version>-Installer.exe）、
  # 安装目录、开始菜单快捷方式名，以及「应用与功能」里的显示名。
  # 与应用显示名保持一致（都是 AppInfoTool）：名字全 ASCII，文件名和
  # 下载链接里不会出现 % 转义，命令行下载才好用。
  # 应用内的显示名来自 assets/i18n 的 title，两处需要同步改。
  name: AppInfoTool
  languages:
    - english
#    - chinesesimplified
