name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # 代码质量闸门：格式化、静态分析、单元测试。
  # 放在最前面并被所有打包任务依赖，避免把坏代码打成 Release。
  quality:
    name: Quality (format / analyze / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        # 只检查项目**自己拥有**的文件。
        #
        # `lib/gen/` 与 `*.g.dart` / `*.freezed.dart` 由生成器排版，而生成器
        # 用的 dart_style 与 SDK 的 `dart format` 风格并不一致（构造器初始化列表
        # 的缩进、`=>` 的换行位置都不同），把它们纳入检查会让这一步永远失败。
        #
        # 生成物已被 .gitignore 排除，因此用 `git ls-files -co --exclude-standard`
        # 取文件列表即可精确表达「只检查我们维护的代码」这个边界。
        #
        # 用 `-co` 而不是只有 `-c`：新增但还没 `git add` 的文件同样要被检查。
        # 只用 `-c` 时新文件会被漏掉，本地跑门禁会通过、CI 才报错。
        run: dart format --output=none --set-exit-if-changed $(git ls-files -co --exclude-standard '*.dart')

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Compile the whole app (no platform toolchain needed)
        # `flutter test` 只编译测试**引用到**的代码，而 `main.dart` 可达的代码
        # 可能更多 —— 一个从未被测试实例化的页面组件，在测试里完全不会被编译。
        # `flutter build bundle` 从 `main.dart` 出发编译整个程序，并解析资产
        # 清单，正好补上这个缺口，而且不需要 Xcode / Android SDK。
        #
        # 注意：这一步**不等于**跨平台构建验证。真正产出可执行文件仍需要
        # 对应平台的工具链（见 README 的说明）。
        run: flutter build bundle

      - name: Analyze Dart packages
        # 遍历 packages/ 而不是逐个硬编码：新增包会被自动纳入门禁，
        # 否则新包的分析结果永远不进 CI（这正是 apk_parser 当初的处境）。
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            echo "::group::dart analyze $pkg"
            (cd "$pkg" && dart pub get && dart analyze --fatal-infos --fatal-warnings)
            echo "::endgroup::"
          done

  build-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync pubspec version from tag
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          python - << 'PY'
          import os
          import re

          version = os.environ["VERSION"]
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"^version:\s*.*$", f"version: {version}", content, flags=re.M)
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Get version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Installer
        run: dart run inno_bundle:build --release

      - name: Create ZIP Package
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../installer/Release/ApkInfoTool-Windows-x86_64-${{ steps.version.outputs.version }}.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/x64/installer/Release/*.exe
            build/windows/x64/installer/Release/*.zip

  build-macos:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync pubspec version from tag
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          python - << 'PY'
          import os
          import re

          version = os.environ["VERSION"]
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"^version:\s*.*$", f"version: {version}", content, flags=re.M)
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          flutter build macos --release

      - name: Create DMG
        run: |
          create-dmg \
            --volname "APP详情工具 ${{ steps.version.outputs.version }}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "APP详情工具.app" 200 190 \
            --hide-extension "APP详情工具.app" \
            --app-drop-link 600 185 \
            "build/macos/APKInfoTool-${{ steps.version.outputs.version }}.dmg" \
            "build/macos/Build/Products/Release/APP详情工具.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg

  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync pubspec version from tag
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          python - << 'PY'
          import os
          import re

          version = os.environ["VERSION"]
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"^version:\s*.*$", f"version: {version}", content, flags=re.M)
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # sudo apt-get install -y cmake clang
          sudo apt-get install -y ninja-build libgtk-3-dev

          flutter pub get --enforce-lockfile
          dart run build_runner build

      - name: Build Linux
        run: flutter build linux --release

      - name: Create AppImage
        run: |
          # 下载 linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          export APPIMAGE_EXTRACT_AND_RUN=1

          # 创建基本 AppDir 结构
          mkdir -p AppDir

          echo "DUMP bundle:["
          find build/linux/x64/release/bundle/
          echo "]END"

          # 首先复制主程序和库文件
          cp -r build/linux/x64/release/bundle AppDir/app

          # 设置正确的权限
          chmod +x AppDir/app/apk_info_tool
          chmod +x AppDir/app/lib/*.so*

          # 创建必要的目录
          mkdir -p AppDir/usr/share/{applications,icons/hicolor/256x256/apps}

          # 创建 desktop 文件
          cat > AppDir/usr/share/applications/apk-info-tool.desktop << EOF
          [Desktop Entry]
          Name=APP详情工具
          Exec=AppRun
          Icon=apk_info_tool
          Type=Application
          Categories=Development;
          Terminal=false
          Version=1.0
          EOF

          # 复制图标
          cp assets/image/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/apk_info_tool.png

          # 创建 AppRun 文件
          cat > AppDir/AppRun << EOF
          #!/bin/bash
          HERE=\$(dirname \$(readlink -f "\${0}"))
          export LD_LIBRARY_PATH=\${HERE}/usr/lib:\$LD_LIBRARY_PATH
          cd \${HERE}/app
          exec ./apk_info_tool "\$@"
          EOF

          chmod +x AppDir/AppRun

          echo "DUMP AppDir:["
          find AppDir/
          echo "]END"

          # 运行 linuxdeploy 并启用调试输出
          ARCH=x86_64 ./linuxdeploy \
            --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/apk-info-tool.desktop \
            --output appimage \
            -v0

          # 重命名 AppImage
          mv *.AppImage APKInfoTool-${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: '*.AppImage'

  create-release:
    # 只要 **Windows 与 macOS** 成功就出 Release：用户要的是这两个平台的发行版，
    # 而 Linux 的 AppImage 依赖 linuxdeploy 这类外部下载，把它设成硬依赖会让
    # 一次无关的下载失败把整个发行版卡掉。Linux 成功就一并附上，失败只少一个文件。
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' }}
    # 显式声明：新建仓库的默认 `GITHUB_TOKEN` 权限是**只读**，不声明的话
    # `action-gh-release` 会以 403 失败。只给这一个 job，不放工作流顶层 ——
    # 工作流也跑 `pull_request`，顶层给写权限等于让同仓 PR 能推代码。
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## Feature", "labels": ["feat", "feature"] },
                { "title": "## Fix", "labels": ["fix", "bug"] },
                { "title": "## Other", "labels": [] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([\\w\\-\\.]+\\))?(!)?:\\s.+$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          # 变更日志后面固定附一段安装说明。macOS 的临时签名（ad-hoc）必须在这里
          # 说清楚：应用是能用的，只是 Gatekeeper 会拦，用户不知道绕过方法就会
          # 以为包坏了 —— 而本项目没有 Apple 开发者证书，短期内改变不了这一点。
          body: |
            ${{ steps.build_changelog.outputs.changelog }}

            ---

            ## 安装说明

            ### macOS（`.dmg`）

            应用是**临时签名（ad-hoc）**的 —— 本项目没有 Apple 开发者证书，因此
            **没有做公证**。首次打开会被 Gatekeeper 拦下，提示「无法验证开发者」
            或「已损坏，应将它移到废纸篓」。包本身是完整的，二选一即可打开：

            - 在「访达」里**右键点应用 → 打开**，在弹窗里再点一次「打开」；
            - 或在终端执行：

              ```sh
              xattr -dr com.apple.quarantine "/Applications/APP详情工具.app"
              ```

            系统要求：macOS 11 或更高。

            ### Windows（`.exe` / `.zip`）

            `.exe` 是安装包，`.zip` 解压后直接运行 `apk_info_tool.exe`。
            两者内容相同，按习惯选一个即可。

            > 未签名的 Windows 程序首次运行可能出现 SmartScreen 提示，选择
            > 「更多信息 → 仍要运行」。

            ### Linux（`.AppImage`）

            ```sh
            chmod +x APKInfoTool-*-x86_64.AppImage
            ./APKInfoTool-*-x86_64.AppImage
            ```
          files: |
            windows-release/*.exe
            windows-release/*.zip
            macos-dmg/*.dmg
            linux-appimage/*.AppImage

  publish-scoop:
    needs: [create-release]
    runs-on: ubuntu-latest
    # 只在上游仓库跑：这两个任务把产物推到原作者的 scoop-bucket /
    # homebrew-tap，依赖只有上游才有的 secret。在 fork 里跑必然失败，
    # 而且真跑通了反而是错的 —— 会把本仓库的版本推进别人的 bucket。
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'huanfeng/ApkInfoTool'

    steps:
      - name: Prepare Scoop Metadata
        id: scoop
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch Scoop Bucket Update
        shell: bash
        env:
          BUCKET_REPO: huanfeng/scoop-bucket
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          VERSION: ${{ steps.scoop.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SCOOP_BUCKET_GITHUB_TOKEN is not set."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BUCKET_REPO}/dispatches" \
            -d "$(jq -n \
              --arg app "apk_info_tool" \
              --arg repo "$REPO" \
              --arg ver "$VERSION" \
              --arg asset "ApkInfoTool-Windows-x86_64-${VERSION}.zip" \
              --arg bin "apk_info_tool.exe" \
              --arg desc "A simple tool for viewing APK/XAPK/APKM file information and installation." \
              --arg homepage "https://github.com/huanfeng/ApkInfoTool" \
              --arg license "MIT" \
              '{
                event_type: "update-scoop-manifest",
                client_payload: {
                  app: $app,
                  repo: $repo,
                  version: $ver,
                  asset_name: $asset,
                  bin: $bin,
                  description: $desc,
                  homepage: $homepage,
                  license: $license
                }
              }')"

  publish-homebrew:
    needs: [create-release]
    runs-on: ubuntu-latest
    # 只在上游仓库跑：这两个任务把产物推到原作者的 scoop-bucket /
    # homebrew-tap，依赖只有上游才有的 secret。在 fork 里跑必然失败，
    # 而且真跑通了反而是错的 —— 会把本仓库的版本推进别人的 bucket。
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'huanfeng/ApkInfoTool'

    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: macos-dmg

      - name: Prepare Homebrew Metadata
        id: brew
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=$(ls macos-dmg/*.dmg | head -n 1)
          DMG_NAME=$(basename "$DMG_PATH")
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "$DMG_PATH" | awk '{print $1}')
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Dispatch Tap Update (Cask)
        shell: bash
        env:
          TAP_REPO: huanfeng/homebrew-tap
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.brew.outputs.version }}
          SHA256: ${{ steps.brew.outputs.sha256 }}
          DMG_NAME: ${{ steps.brew.outputs.dmg_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not set."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TAP_REPO}/dispatches" \
            -d "$(jq -n \
              --arg repo "$REPO" \
              --arg tag "$RELEASE_TAG" \
              --arg ver "$VERSION" \
              --arg dmg "$DMG_NAME" \
              --arg sha "$SHA256" \
              '{
                event_type: "update-cask",
                client_payload: {
                  repo: $repo,
                  release_tag: $tag,
                  version: $ver,
                  dmg_name: $dmg,
                  sha256: $sha
                }
              }')"

  publish-homebrew-formula:
    needs: [create-release]
    runs-on: ubuntu-latest
    # 只在上游仓库跑：这两个任务把产物推到原作者的 scoop-bucket /
    # homebrew-tap，依赖只有上游才有的 secret。在 fork 里跑必然失败，
    # 而且真跑通了反而是错的 —— 会把本仓库的版本推进别人的 bucket。
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'huanfeng/ApkInfoTool'

    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: macos-dmg

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: linux-appimage

      - name: Prepare Homebrew Formula Metadata
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=$(ls macos-dmg/*.dmg | head -n 1)
          DMG_NAME=$(basename "$DMG_PATH")
          DMG_SHA256=$(sha256sum "$DMG_PATH" | awk '{print $1}')

          APPIMAGE_PATH=$(ls linux-appimage/*.AppImage | head -n 1)
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          APPIMAGE_SHA256=$(sha256sum "$APPIMAGE_PATH" | awk '{print $1}')

          VERSION="${GITHUB_REF_NAME#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "appimage_name=$APPIMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "appimage_sha256=$APPIMAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Dispatch Tap Update (Formula)
        shell: bash
        env:
          TAP_REPO: huanfeng/homebrew-tap
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
          DMG_NAME: ${{ steps.formula.outputs.dmg_name }}
          DMG_SHA256: ${{ steps.formula.outputs.dmg_sha256 }}
          APPIMAGE_NAME: ${{ steps.formula.outputs.appimage_name }}
          APPIMAGE_SHA256: ${{ steps.formula.outputs.appimage_sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not set."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TAP_REPO}/dispatches" \
            -d "$(jq -n \
              --arg repo "$REPO" \
              --arg tag "$RELEASE_TAG" \
              --arg ver "$VERSION" \
              --arg dmg "$DMG_NAME" \
              --arg dmg_sha "$DMG_SHA256" \
              --arg appimage "$APPIMAGE_NAME" \
              --arg appimage_sha "$APPIMAGE_SHA256" \
              '{
                event_type: "update-formula",
                client_payload: {
                  repo: $repo,
                  release_tag: $tag,
                  version: $ver,
                  dmg_name: $dmg,
                  dmg_sha256: $dmg_sha,
                  appimage_name: $appimage,
                  appimage_sha256: $appimage_sha
                }
              }')"
