name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # 代码质量闸门：格式化、静态分析、单元测试。
  # 放在最前面并被所有打包任务依赖，避免把坏代码打成 Release。
  quality:
    name: Quality (format / analyze / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        # 只检查项目**自己拥有**的文件。
        #
        # `lib/gen/` 与 `*.g.dart` / `*.freezed.dart` 由生成器排版，而生成器
        # 用的 dart_style 与 SDK 的 `dart format` 风格并不一致（构造器初始化列表
        # 的缩进、`=>` 的换行位置都不同），把它们纳入检查会让这一步永远失败。
        #
        # 生成物已被 .gitignore 排除，因此用 `git ls-files -co --exclude-standard`
        # 取文件列表即可精确表达「只检查我们维护的代码」这个边界。
        #
        # 用 `-co` 而不是只有 `-c`：新增但还没 `git add` 的文件同样要被检查。
        # 只用 `-c` 时新文件会被漏掉，本地跑门禁会通过、CI 才报错。
        run: dart format --output=none --set-exit-if-changed $(git ls-files -co --exclude-standard '*.dart')

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Core tests (root test/ — fixtures + widget tests)
        # 这一层**必跑**：输入全部来自仓库内的夹具或构造数据，不依赖任何
        # 个人机器路径。
        #
        # 真实样本测试（`real_samples_test.dart` / `real_samples_ui_test.dart`）
        # 也住在 `test/` 下，但它们在没配 `APPINFOTOOL_SAMPLES` 时会**显式跳过**
        # 并打印原因 —— 跳过不等于通过。它们的执行情况由独立的
        # `external-samples` job 单独呈现，不让「跳过」淹没在这里的 900 多项里。
        run: flutter test

      - name: Compile the whole app (no platform toolchain needed)
        # `flutter test` 只编译测试**引用到**的代码，而 `main.dart` 可达的代码
        # 可能更多 —— 一个从未被测试实例化的页面组件，在测试里完全不会被编译。
        # `flutter build bundle` 从 `main.dart` 出发编译整个程序，并解析资产
        # 清单，正好补上这个缺口，而且不需要 Xcode / Android SDK。
        #
        # 注意：这一步**不等于**跨平台构建验证。真正产出可执行文件仍需要
        # 对应平台的工具链（见 README 的说明）。
        run: flutter build bundle

      - name: Analyze Dart packages
        # 遍历 packages/ 而不是逐个硬编码：新增包会被自动纳入门禁，
        # 否则新包的分析结果永远不进 CI（这正是 apk_parser 当初的处境）。
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            echo "::group::dart analyze $pkg"
            (cd "$pkg" && dart pub get && dart analyze --fatal-infos --fatal-warnings)
            echo "::endgroup::"
          done

      - name: Package-level tests (packages/*/test)
        # 四个核心包各有自己的 `test/`，验证「作为独立库可用」——
        # 与根测试的分工：根测试证明「应用用对了包」，这里证明「包自己能成立」。
        #
        # 夹具路径写成相对包目录的 `../../test/fixtures/...`，因此
        # **不依赖任何个人机器路径**，CI 与本地跑的是同一份。
        #
        # 没有测试文件的包**直接失败**，而不是悄悄跳过：门禁的价值在于
        # 「关键测试确实执行了」，缺测试必须让 CI 红，不能让它绿着蒙混过去。
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            if ! ls "$pkg"/test/*_test.dart >/dev/null 2>&1; then
              echo "::error::$pkg 没有包级测试（$pkg/test/*_test.dart）。\
          新增包必须带上关键纯逻辑的测试。"
              exit 1
            fi
            echo "::group::dart test $pkg"
            (cd "$pkg" && dart pub get && dart test --reporter expanded)
            echo "::endgroup::"
          done

  # 外部真实样本测试：**单独一个 job**，让「跑没跑 / 为什么没跑」一眼可见。
  #
  # 样本不进版本库（体积大、且属于用户数据），因此 CI 上必然是跳过的。
  # 把它从 `flutter test` 里拎出来单列，是为了不让「跳过」被读成一个
  # 不起眼的 `~11` —— 那正是「整体绿着、关键测试其实没跑」的经典形态。
  external-samples:
    name: External samples (needs APPINFOTOOL_SAMPLES)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs

      - name: Report sample availability
        # 缺样本是**环境限制**（不是失败），但必须显式说出来，
        # 否则「CI 全绿」会被读成「端到端也验过了」。
        run: |
          if [ -n "${APPINFOTOOL_SAMPLES:-}" ]; then
            echo "::notice::APPINFOTOOL_SAMPLES 已配置：$APPINFOTOOL_SAMPLES"
          else
            echo "::warning title=外部真实样本测试未执行::\
          CI 未配置 APPINFOTOOL_SAMPLES，端到端真实样本测试将整体跳过。\
          这是环境限制（样本体积大且属于用户数据，不入库），不是产品缺陷；\
          但也意味着**本次 CI 没有验证过真实 APK/IPA**。\
          本地跑法：APPINFOTOOL_SAMPLES=/path/to/samples flutter test test/real_samples_test.dart test/real_samples_ui_test.dart"
          fi

      - name: External sample tests (逐条打印跳过原因)
        # `--reporter expanded` 会把每条 Skip 与它的原因单独打出来，
        # 而不是汇总成一个计数。
        run: |
          flutter test test/real_samples_test.dart test/real_samples_ui_test.dart \
            --reporter expanded

  build-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync pubspec version from tag
        # 只在打 tag 时运行。
        #
        # main 分支推送时 `GITHUB_REF_NAME` 是 "main"，去掉前缀 v 之后仍然是
        # "main"，于是 pubspec 的 version 被改写成 `version: main` —— 非法版本号，
        # 三个平台的构建会全部失败（macOS 报 exit code 65，Linux / Windows
        # 卡在 pub get）。这正是 v2.0.0 之后连续两次构建失败的根因。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          python - << 'PY'
          import os
          import re

          version = os.environ["VERSION"]
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"^version:\s*.*$", f"version: {version}", content, flags=re.M)
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Get version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          flutter pub get --enforce-lockfile
          # 与 quality job 保持一致：不带 --delete-conflicting-outputs 时，
          # 一旦存在冲突产物 build_runner 会直接失败。
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        # 失败时把编译器/链接器的错误行**变成 annotation**。
        #
        # 为什么需要这一步：job 日志要仓库 admin 权限才能通过 API 拉取
        # （`/actions/jobs/<id>/logs` 返回 403），而 annotations 是公开可读的。
        # 没有它，失败时只能在评审界面看到一句「Process completed with
        # exit code 1」，完全不知道哪个 .cpp 的哪一行出问题 —— v2.4.15
        # 第一次构建就是这么卡住的。
        #
        # `set -o pipefail` 必不可少：不设的话 `| tee` 会把退出码换成 tee 的 0，
        # 构建失败也当成功（本项目的门禁命令踩过同一个坑）。
        shell: bash
        run: |
          set -o pipefail
          BUILD_LOG="$RUNNER_TEMP/build-windows.log"
          if flutter build windows --release 2>&1 | tee "$BUILD_LOG"; then
            exit 0
          fi
          echo "::error::flutter build windows 失败，下面是错误行"
          # MSVC 的错误形如 `xxx.cpp(12,34): error C2065: ...`，
          # 链接错误形如 `LINK : fatal error LNK2019: ...`。
          grep -iE 'error [A-Z]+[0-9]+|fatal error|error:' "$BUILD_LOG" \
            | head -40 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done
          exit 1

      - name: Create Installer
        run: dart run inno_bundle:build --release

      # inno_bundle 的输出名写死在它自己的 script_builder 里
      # （OutputBaseFilename=<name>-<arch>-<version>-Installer.exe），改不掉。
      # 这里统一改成与另外三个平台一致的命名，免得三平台三个样。
      - name: Normalize installer name
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          cd build/windows/x64/installer/Release
          SRC=$(ls *-Installer.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$SRC" ]; then
            echo "::error::在 installer/Release 下没找到 *-Installer.exe"
            exit 1
          fi
          DST="AppInfoTool-${V}-Windows-x86_64-Setup.exe"
          mv "$SRC" "$DST"
          echo "安装包改名：$SRC -> $DST"

      - name: Create ZIP Package
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          cd build/windows/x64/runner/Release
          7z a "../../installer/Release/AppInfoTool-${V}-Windows-x86_64.zip" *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/x64/installer/Release/AppInfoTool-*-Windows-x86_64-Setup.exe
            build/windows/x64/installer/Release/AppInfoTool-*-Windows-x86_64.zip

  build-macos:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync pubspec version from tag
        # 只在打 tag 时运行。
        #
        # main 分支推送时 `GITHUB_REF_NAME` 是 "main"，去掉前缀 v 之后仍然是
        # "main"，于是 pubspec 的 version 被改写成 `version: main` —— 非法版本号，
        # 三个平台的构建会全部失败（macOS 报 exit code 65，Linux / Windows
        # 卡在 pub get）。这正是 v2.0.0 之后连续两次构建失败的根因。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          python - << 'PY'
          import os
          import re

          version = os.environ["VERSION"]
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"^version:\s*.*$", f"version: {version}", content, flags=re.M)
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          flutter build macos --release

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          # 应用名统一为 AppInfoTool，卷标、.app 名与文件名三者一致。
          # 构建产物是 universal（x86_64 + arm64），因此名字里写 universal
          # 而不是某个架构。
          V="${{ steps.version.outputs.version }}"
          create-dmg \
            --volname "AppInfoTool ${V}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "AppInfoTool.app" 200 190 \
            --hide-extension "AppInfoTool.app" \
            --app-drop-link 600 185 \
            "build/macos/AppInfoTool-${V}-macOS-universal.dmg" \
            "build/macos/Build/Products/Release/AppInfoTool.app"

      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          DMG="build/macos/AppInfoTool-${V}-macOS-universal.dmg"
          test -f "$DMG" || { echo "::error::$DMG 不存在"; exit 1; }
          # 产物必须真的挂在起来、里面是那个 .app，并且名字对得上 ——
          # 否则发布出去的是一个空壳。
          MOUNT=$(hdiutil attach -nobrowse -readonly -plist "$DMG" \
            | plutil -extract system-entities xml1 -o - - \
            | grep -o '/Volumes/[^<]*' | head -n 1)
          ls -la "${MOUNT}/" | sed 's/^/  /'
          test -d "${MOUNT}/AppInfoTool.app"
          codesign --verify --strict "${MOUNT}/AppInfoTool.app"
          hdiutil detach -quiet "$MOUNT"
          echo "DMG 校验通过：$DMG"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg

  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sync pubspec version from tag
        # 只在打 tag 时运行。
        #
        # main 分支推送时 `GITHUB_REF_NAME` 是 "main"，去掉前缀 v 之后仍然是
        # "main"，于是 pubspec 的 version 被改写成 `version: main` —— 非法版本号，
        # 三个平台的构建会全部失败（macOS 报 exit code 65，Linux / Windows
        # 卡在 pub get）。这正是 v2.0.0 之后连续两次构建失败的根因。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          python - << 'PY'
          import os
          import re

          version = os.environ["VERSION"]
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"^version:\s*.*$", f"version: {version}", content, flags=re.M)
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          # GitHub runner 的 apt 镜像源偶发 503。这一步失败会让整个 job 挂掉，
          # 而它跟构建本身毫无关系 —— 加重试，别让基础设施抖动浪费一次发布。
          sudo apt-get -o Acquire::Retries=3 update
          # sudo apt-get install -y cmake clang
          sudo apt-get -o Acquire::Retries=3 install -y ninja-build libgtk-3-dev

          flutter pub get --enforce-lockfile
          # 与 quality job 保持一致：不带 --delete-conflicting-outputs 时，
          # 一旦存在冲突产物 build_runner 会直接失败。
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Create AppImage
        run: |
          # 下载 linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          export APPIMAGE_EXTRACT_AND_RUN=1

          # 创建基本 AppDir 结构
          mkdir -p AppDir

          echo "DUMP bundle:["
          find build/linux/x64/release/bundle/
          echo "]END"

          # 首先复制主程序和库文件
          cp -r build/linux/x64/release/bundle AppDir/app

          # 设置正确的权限
          chmod +x AppDir/app/apk_info_tool
          chmod +x AppDir/app/lib/*.so*

          # 创建必要的目录
          mkdir -p AppDir/usr/share/{applications,icons/hicolor/256x256/apps}

          # 创建 desktop 文件
          cat > AppDir/usr/share/applications/apk-info-tool.desktop << EOF
          [Desktop Entry]
          Name=AppInfoTool
          Exec=AppRun
          Icon=apk_info_tool
          Type=Application
          Categories=Development;
          Terminal=false
          Version=1.0
          EOF

          # 复制图标
          cp assets/image/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/apk_info_tool.png

          # 创建 AppRun 文件
          cat > AppDir/AppRun << EOF
          #!/bin/bash
          HERE=\$(dirname \$(readlink -f "\${0}"))
          export LD_LIBRARY_PATH=\${HERE}/usr/lib:\$LD_LIBRARY_PATH
          cd \${HERE}/app
          exec ./apk_info_tool "\$@"
          EOF

          chmod +x AppDir/AppRun

          echo "DUMP AppDir:["
          find AppDir/
          echo "]END"

          # 运行 linuxdeploy 并启用调试输出
          ARCH=x86_64 ./linuxdeploy \
            --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/apk-info-tool.desktop \
            --output appimage \
            -v0

          # 重命名 AppImage。linuxdeploy 的默认名不可控，统一改成与其余平台
          # 一致的命名。可执行文件名仍是 apk_info_tool（Dart 包名），
          # 那是工程名不是产物名，不随这里改。
          mv *.AppImage AppInfoTool-${{ steps.version.outputs.version }}-Linux-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: '*.AppImage'

  create-release:
    # 只要 **Windows 与 macOS** 成功就出 Release：用户要的是这两个平台的发行版，
    # 而 Linux 的 AppImage 依赖 linuxdeploy 这类外部下载，把它设成硬依赖会让
    # 一次无关的下载失败把整个发行版卡掉。Linux 成功就一并附上，失败只少一个文件。
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' }}
    # 显式声明：新建仓库的默认 `GITHUB_TOKEN` 权限是**只读**，不声明的话
    # `action-gh-release` 会以 403 失败。只给这一个 job，不放工作流顶层 ——
    # 工作流也跑 `pull_request`，顶层给写权限等于让同仓 PR 能推代码。
    permissions:
      contents: write

    steps:
      # 必须先有仓库，`git log` 才有对象可读。这个 job 原先只下载制品，
      # 于是那里没有任何 checkout —— 换成第三方 changelog action 时看不出来
      # （它走 API），自己拼 changelog 后就会直接以
      # "fatal: not a git repository" 失败，而且是在**产物已经建好之后**才炸。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拿**完整历史**：默认的 fetch-depth 1 是浅克隆，既看不到上一个
          # tag，也看不到本次发布之前那些提交。
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Build changelog from git log
        id: changelog
        # 用 `git log` 自己拼，不用外部的 changelog-builder action —— 实测那个在
        # **首个 release（此前没有任何 tag）**时输出是空的，发布页上只剩一段空白。
        # 自己拼还有一个好处：规则看得见、可改，不用去翻第三方文档。
        #
        # 分类规则按 Conventional Commits 取 type：`type[(scope)][!]:`。
        # 首行必须是 `type: `，否则整条进「其它」—— 宁可噪音多一点，也不能漏。
        #
        # **必须允许复合 type。** 本仓的提交风格是 `fix(overview) + docs(audit): ...`
        # 这种「一个提交同时做两件事、两个 type 都写上」的写法，25 个提交里有 3 条。
        # 分类器原先只认单个 type，于是这类提交**全部落进「其它」** ——
        # v2.3.1 的发布页上，本轮最重要的那条修复就在「其它」里躺着。
        # 归类按**第一个** type（那是这条提交的主类型），冒号前的其余组合允许存在。
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)
          if [ -n "${PREV:-}" ]; then
            RANGE="${PREV}..HEAD"
          else
            # 首个 release：从仓库的第一个提交算起。
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi

          # %s 是提交主题（首行），不带换行；统一加 "- " 前缀，下面各分类都用它。
          SUBJECTS=$(git log --no-merges --pretty='- %s' "$RANGE")
          # 冒号之前可能出现的「+ type[(scope)][!]」组合，用来兼容复合写法。
          TYPES='(feat|fix|perf|refactor|build|ci|chore|docs|style|test|revert)'
          MORE="([+ ]+${TYPES}(\([^)]+\))?!?)*"
          TYPED="^[-] ${TYPES}(\([^)]+\))?!?${MORE}: "

          emit() {
            # $1 = 小节标题，$2 = 已经筛好的条目；空的一节整节不输出。
            local title="$1" items="$2"
            if [ -n "${items//[[:space:]]/}" ]; then
              printf '### %s\n%s\n\n' "$title" "$items"
            fi
          }

          # 兼容 POSIX sh（GitHub 的 run 走 bash，但 emit 在子 shell 里也能用）。
          # $1 = 小节标题，$2 = 这些小节的 type（`|` 分隔）。
          # 归类的依据是**首个** type —— 一条提交只会进恰好一个小节，
          # 也因此下面的冒烟断言「列出的条数 == 提交条数」才不会因为重复计数而误报。
          emit_typed() {
            emit "$1" "$(printf '%s\n' "$SUBJECTS" \
              | grep -E "^[-] ($2)(\([^)]+\))?!?${MORE}: " || true)"
          }

          {
            printf '## 更新内容\n\n'
            emit_typed '新功能' 'feat'
            emit_typed '修复' 'fix'
            # `revert` **必须**有自己的小节。它出现在 $TYPES 里，所以「其它」
            # 那一节的否定式会把它排除掉；如果这里也没有用它，那条提交就
            # 从 changelog 里凭空消失，并触发下面的「条数 == 条数」断言。
            # v2.4.16 首次发布就栽在这里（`revert(ui):` 那条不见了）。
            emit_typed '回退' 'revert'
            emit_typed '重构与优化' 'perf|refactor'
            emit_typed '工程与构建' 'build|ci|chore'
            emit_typed '文档' 'docs'
            emit_typed '样式' 'style'
            emit_typed '测试' 'test'
            # 没归进上面任何一类的一条。这里用**否定**而不是 `^` —— `^` 会把
            # 已经列过的再列一遍。
            emit '其它' "$(printf '%s\n' "$SUBJECTS" | grep -Ev "$TYPED" || true)"
          } > changelog.md

          # 冒烟：空输出说明 git log 范围选错了。这时要失败，而不是发布一篇空的。
          TOTAL=$(printf '%s\n' "$SUBJECTS" | grep -c .)
          LISTED=$(grep -cE '^[-] ' changelog.md)
          echo "提交 ${TOTAL} 条，changelog 列出 ${LISTED} 条"
          if [ "$TOTAL" -lt 1 ] || [ "$LISTED" -ne "$TOTAL" ]; then
            echo "::error::changelog 异常（RANGE=${RANGE}，${TOTAL} 条提交但只列出 ${LISTED} 条）"
            exit 1
          fi

          cat changelog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble release body
        # 安装说明放在仓库里（`docs/release-install-notes.md`），而不是塞进
        # 工作流的 `body:` —— 那样一来看不见版本变化，二来 YAML 里的
        # `${{ }}` 插值的收尾换行处理很脆。用 `body_path` 读文件最稳。
        #
        # `{版本}` 是文档里的占位符（仓库里那份要让各个版本都能看），
        # 在这里替换成 tag 的真实版本 —— 否则发布页上会明晃晃写着 `{版本}`。
        #
        # 用 bash 的参数展开而不是 sed：**sed 的正则里 `{` 是量词起始符**，
        # 中文花括号在 BSD sed（本地）与 GNU sed（CI）上的行为不一致，
        # 第一次就在这栽了。参数展开是原样子串替换，没有这层差别。
        id: body
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(cat docs/release-install-notes.md)

          BEFORE=$(printf '%s\n' "$NOTES" | grep -c '{版本}' || true)
          NOTES="${NOTES//\{版本\}/$VERSION}"
          AFTER=$(printf '%s\n' "$NOTES" | grep -c '{版本}' || true)
          echo "安装说明：{版本} 替换前 ${BEFORE} 处，替换后 ${AFTER} 处"

          # 只断言**安装说明**这一段，不要断言整个正文：changelog 来自 git log，
          # 提交标题里完全可能正当地提到 {版本}（本项目就有一条），
          # 那是说明文字不是漏替换。
          if [ "$AFTER" != "0" ]; then
            echo "::error::安装说明里还有未替换的 {版本}"
            printf '%s\n' "$NOTES" | grep -n '{版本}'
            exit 1
          fi

          {
            cat changelog.md
            printf '\n---\n\n'
            printf '%s\n' "$NOTES"
          } > release-body.md
          {
            echo 'body_path<<EOF'
            echo 'release-body.md'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cp release-body.md "$GITHUB_STEP_SUMMARY"
          echo "发布正文版本号：${VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          files: |
            windows-release/*.exe
            windows-release/*.zip
            macos-dmg/*.dmg
            linux-appimage/*.AppImage

  publish-scoop:
    needs: [create-release]
    runs-on: ubuntu-latest
    # 只在上游仓库跑：这两个任务把产物推到原作者的 scoop-bucket /
    # homebrew-tap，依赖只有上游才有的 secret。在 fork 里跑必然失败，
    # 而且真跑通了反而是错的 —— 会把本仓库的版本推进别人的 bucket。
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'huanfeng/ApkInfoTool'

    steps:
      - name: Prepare Scoop Metadata
        id: scoop
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch Scoop Bucket Update
        shell: bash
        env:
          BUCKET_REPO: huanfeng/scoop-bucket
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          VERSION: ${{ steps.scoop.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SCOOP_BUCKET_GITHUB_TOKEN is not set."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BUCKET_REPO}/dispatches" \
            -d "$(jq -n \
              --arg app "apk_info_tool" \
              --arg repo "$REPO" \
              --arg ver "$VERSION" \
              --arg asset "AppInfoTool-Windows-x86_64-${VERSION}.zip" \
              --arg bin "apk_info_tool.exe" \
              --arg desc "A tool for viewing APK/XAPK/APKM and IPA information." \
              --arg homepage "https://github.com/huanfeng/ApkInfoTool" \
              --arg license "MIT" \
              '{
                event_type: "update-scoop-manifest",
                client_payload: {
                  app: $app,
                  repo: $repo,
                  version: $ver,
                  asset_name: $asset,
                  bin: $bin,
                  description: $desc,
                  homepage: $homepage,
                  license: $license
                }
              }')"

  publish-homebrew:
    needs: [create-release]
    runs-on: ubuntu-latest
    # 只在上游仓库跑：这两个任务把产物推到原作者的 scoop-bucket /
    # homebrew-tap，依赖只有上游才有的 secret。在 fork 里跑必然失败，
    # 而且真跑通了反而是错的 —— 会把本仓库的版本推进别人的 bucket。
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'huanfeng/ApkInfoTool'

    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: macos-dmg

      - name: Prepare Homebrew Metadata
        id: brew
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=$(ls macos-dmg/*.dmg | head -n 1)
          DMG_NAME=$(basename "$DMG_PATH")
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "$DMG_PATH" | awk '{print $1}')
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Dispatch Tap Update (Cask)
        shell: bash
        env:
          TAP_REPO: huanfeng/homebrew-tap
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.brew.outputs.version }}
          SHA256: ${{ steps.brew.outputs.sha256 }}
          DMG_NAME: ${{ steps.brew.outputs.dmg_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not set."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TAP_REPO}/dispatches" \
            -d "$(jq -n \
              --arg repo "$REPO" \
              --arg tag "$RELEASE_TAG" \
              --arg ver "$VERSION" \
              --arg dmg "$DMG_NAME" \
              --arg sha "$SHA256" \
              '{
                event_type: "update-cask",
                client_payload: {
                  repo: $repo,
                  release_tag: $tag,
                  version: $ver,
                  dmg_name: $dmg,
                  sha256: $sha
                }
              }')"

  publish-homebrew-formula:
    needs: [create-release]
    runs-on: ubuntu-latest
    # 只在上游仓库跑：这两个任务把产物推到原作者的 scoop-bucket /
    # homebrew-tap，依赖只有上游才有的 secret。在 fork 里跑必然失败，
    # 而且真跑通了反而是错的 —— 会把本仓库的版本推进别人的 bucket。
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'huanfeng/ApkInfoTool'

    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: macos-dmg

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: linux-appimage

      - name: Prepare Homebrew Formula Metadata
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=$(ls macos-dmg/*.dmg | head -n 1)
          DMG_NAME=$(basename "$DMG_PATH")
          DMG_SHA256=$(sha256sum "$DMG_PATH" | awk '{print $1}')

          APPIMAGE_PATH=$(ls linux-appimage/*.AppImage | head -n 1)
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          APPIMAGE_SHA256=$(sha256sum "$APPIMAGE_PATH" | awk '{print $1}')

          VERSION="${GITHUB_REF_NAME#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "appimage_name=$APPIMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "appimage_sha256=$APPIMAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Dispatch Tap Update (Formula)
        shell: bash
        env:
          TAP_REPO: huanfeng/homebrew-tap
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
          DMG_NAME: ${{ steps.formula.outputs.dmg_name }}
          DMG_SHA256: ${{ steps.formula.outputs.dmg_sha256 }}
          APPIMAGE_NAME: ${{ steps.formula.outputs.appimage_name }}
          APPIMAGE_SHA256: ${{ steps.formula.outputs.appimage_sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not set."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TAP_REPO}/dispatches" \
            -d "$(jq -n \
              --arg repo "$REPO" \
              --arg tag "$RELEASE_TAG" \
              --arg ver "$VERSION" \
              --arg dmg "$DMG_NAME" \
              --arg dmg_sha "$DMG_SHA256" \
              --arg appimage "$APPIMAGE_NAME" \
              --arg appimage_sha "$APPIMAGE_SHA256" \
              '{
                event_type: "update-formula",
                client_payload: {
                  repo: $repo,
                  release_tag: $tag,
                  version: $ver,
                  dmg_name: $dmg,
                  dmg_sha256: $dmg_sha,
                  appimage_name: $appimage,
                  appimage_sha256: $appimage_sha
                }
              }')"
